server:
  # Hosts such as Railway, Render and Fly assign the port through $PORT.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: emanstagram

  # -----------------------------------------------------------------
  # LOADING backend/.env
  #
  # Spring Boot does NOT read a .env file on its own. Without this
  # import, a perfectly good backend/.env would be silently ignored and
  # every value would fall back to the defaults below, which fail at
  # runtime with confusing errors.
  #
  # `optional:` means the app still starts when no .env exists, which is
  # what the `local` profile and CI rely on.
  # -----------------------------------------------------------------
  config:
    import: "optional:file:.env[.properties]"

  # ---------------------------------------------------------------
  # DATABASE
  #
  # Two ways to reach Supabase Postgres. Pick ONE:
  #
  #  A) DIRECT CONNECTION (recommended for a long-running backend)
  #     host: db.<ref>.supabase.co   port 5432
  #     Prepared statements work normally.
  #     Free tier allows only ~15 connections total, so keep
  #     DB_POOL_SIZE at 5 or below.
  #
  #  B) SUPAVISOR CONNECTION POOLER (transaction mode)
  #     host: aws-0-<region>.pooler.supabase.com   port 6543
  #     NOTE the different hostname - it is NOT db.<ref>.supabase.co.
  #     Transaction mode does NOT support prepared statements, so
  #     DB_PREPARE_THRESHOLD must be 0 or every query fails with
  #     'prepared statement "S_1" already exists'. The default below
  #     handles that automatically.
  #
  # In both cases ?sslmode=require is mandatory.
  #
  # LOCAL DEV: run the `local` profile for a zero-setup in-memory DB.
  #   mvnw spring-boot:run -Dspring-boot.run.profiles=local
  # ---------------------------------------------------------------
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # Free tier caps direct connections at roughly 15, shared with
      # the dashboard and any other clients. 5 leaves headroom.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      # Shorter than a typical socket lifetime so a recycled Supabase
      # connection is never handed out after the server has dropped it.
      max-lifetime: 900000
      keepalive-time: 240000
    # Properties passed straight through to the PostgreSQL JDBC driver.
    data-source-properties:
      # Transaction-mode pooling (port 6543) cannot support server-side
      # prepared statements, so they are disabled by default. This is
      # also safe on a direct connection (5432), costing only a little
      # throughput. Set DB_PREPARE_THRESHOLD=-1 to re-enable them.
      prepareThreshold: ${DB_PREPARE_THRESHOLD:0}
      # Fail fast rather than hanging when the network drops mid-query.
      socketTimeout: 30
      connectTimeout: 10

  jpa:
    hibernate:
      # Flyway owns the schema. ddl-auto must never write to it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Cleaning drops every object in the schema and re-runs the migrations
    # from scratch. Disabled by default so a careless flag can never wipe a
    # real database. Set FLYWAY_CLEAN_DISABLED=false while developing, and
    # repair the schema history table with `flyway repair` after editing a
    # migration that has already been applied.
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

  servlet:
    multipart:
      # Backstop gate #2 of 3 for uploads (client checks first).
      max-file-size: 20MB
      max-request-size: 220MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---------------------------------------------------------------
  # SERVING THE BUILT FRONTEND
  #
  # In production the backend can also serve the compiled React bundle,
  # so a single deployable covers API and UI. Point FRONTEND_DIST at
  # the folder containing the Vite `dist` output. Left empty in dev,
  # where Vite serves the UI on :5173.
  # ---------------------------------------------------------------
  web:
    resources:
      static-locations: ${FRONTEND_DIST:}
  mvc:
    # Client-side routing: unknown non-API paths fall through to
    # index.html so deep links like /u/emma survive a hard refresh.
    throw-exception-if-no-handler-found: false

  threads:
    virtual:
      enabled: true

# ---------------------------------------------------------------------
# APP CONFIG (bound to EmanstagramProperties)
# ---------------------------------------------------------------------
emanstagram:
  jwt:
    # MUST be overridden in production. Generate with:
    #   openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    issuer: emanstagram

  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  storage:
    # supabase = Supabase Storage (5 GB/month egress on the free tier)
    # s3       = any S3-compatible store; Cloudflare R2 has no egress fees
    provider: ${STORAGE_PROVIDER:supabase}

    # --- provider: s3 ------------------------------------------------
    s3:
      # R2: https://<account-id>.r2.cloudflarestorage.com
      endpoint: ${S3_ENDPOINT:}
      # R2 uses "auto"
      region: ${S3_REGION:auto}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}
      # Public: posts/, avatars/, stories/. Private: messages/ (signed URLs).
      public-bucket: ${S3_PUBLIC_BUCKET:}
      private-bucket: ${S3_PRIVATE_BUCKET:}
      # Where browsers fetch public media from, e.g. https://media.example.com
      # or https://pub-xxxx.r2.dev. No trailing slash needed.
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      path-style: ${S3_PATH_STYLE:true}

    # --- provider: supabase ------------------------------------------
    url: ${SUPABASE_URL:}
    # The elevated key, used server-side only.
    #
    # Named `service-role-key` for historic reasons: Supabase has deprecated
    # the legacy `service_role` JWT in favour of `sb_secret_...`. Both carry
    # identical privileges, so paste whichever your dashboard shows.
    #
    # This bypasses Row Level Security. Never expose it to a browser.
    #
    # Only one variable is accepted on purpose. A nested fallback such as
    # ${NEW:${OLD:}} looks safer but is not: Spring treats an environment
    # variable that is present-but-empty as a real value, so the fallback is
    # never reached and a .env containing an empty SUPABASE_SECRET_KEY next
    # to a filled-in legacy one silently loses the key.
    service-role-key: ${SUPABASE_SECRET_KEY:}
    buckets:
      posts: ${SUPABASE_BUCKET_POSTS:posts}
      avatars: ${SUPABASE_BUCKET_AVATAVARS:avatars}
      stories: ${SUPABASE_BUCKET_STORIES:stories}
      messages: ${SUPABASE_BUCKET_MESSAGES:messages}

  media:
    # Hard upload caps. Enforced in three places:
    #   1. client (pre-flight + transcode)
    #   2. server (MediaValidationService)
    #   3. Spring multipart max-file-size above
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}      # 10 MB
    max-video-bytes: ${MAX_VIDEO_BYTES:15728640}      # 15 MB
    max-avatar-bytes: ${MAX_AVATAR_BYTES:5242880}     # 5 MB
    max-story-video-bytes: ${MAX_STORY_VIDEO_BYTES:20971520}  # 20 MB
    max-carousel-items: 10
    max-caption-length: 2200
    max-comment-length: 1000
    allowed-image-types: image/jpeg,image/png,image/webp,image/gif
    allowed-video-types: video/mp4,video/webm,video/quicktime

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.emanstagram: DEBUG
    org.hibernate.SQL: WARN
