# =====================================================================
# LOCAL PROFILE
#
# Zero-setup development: in-memory H2, no Postgres, no Supabase.
# Flyway is OFF because V1__init.sql uses Postgres-specific syntax
# (citext, pgcrypto, native ENUMs, partial indexes) that H2 rejects.
# Hibernate builds the schema from the entities instead, which is
# enough for UI work. The real schema is only exercised against
# Postgres in production.
#
#   mvnw spring-boot:run -Dspring-boot.run.profiles=local
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:mem:emanstagram;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

emanstagram:
  # Deliberately does NOT redefine emanstagram.storage.
  #
  # A profile-specific file REPLACES whole YAML keys rather than merging them,
  # so repeating the storage block here would shadow the definitions in
  # application.yml. When this file still referenced the old
  # SUPABASE_SERVICE_ROLE_KEY variable, the result was that the real key from
  # .env was discarded and the app reported storage as unconfigured no matter
  # what was configured correctly.
  #
  # application.yml already defaults both values to empty, which is exactly
  # the behaviour wanted when no credentials are present: upload endpoints
  # return a clear STORAGE_NOT_CONFIGURED error instead of crashing.
  storage: {}

logging:
  level:
    com.emanstagram: DEBUG
