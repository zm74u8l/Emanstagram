<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <meta
      name="description"
      content="Emanstagram - share photos and videos, follow people, and chat."
    />
    <title>Emanstagram</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a
      // white flash while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('emanstagram.theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored === 'system' && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode: fall back to the default dark class */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
