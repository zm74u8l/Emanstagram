name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes any in-flight run for the same branch irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          # Cache dependencies rather than the whole Maven install.
          cache: maven

      - name: Verify the build compiles
        run: mvn -B -q compile
        working-directory: backend

      # Runs on the H2 `local` profile, so no secrets are needed here.
      # Real Postgres/Supabase behaviour is verified at deploy time.
      - name: Run tests
        run: mvn -B test
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
